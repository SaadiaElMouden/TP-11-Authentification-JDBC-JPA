<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Application Sécurisée</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px 25px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin: 0 0 10px;
            color: #2b5797;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2b5797;
            box-shadow: 0 0 4px rgba(43, 87, 151, 0.3);
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
             background: #28a745;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e7e34;
        }

        .error {
            background-color: #ffe5e5;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .logout {
            background-color: #e8f8ec;
            color: #1e8449;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Authentification</h2>
    <p class="subtitle">Connectez-vous pour accéder à votre espace sécurisé</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Nom d’utilisateur :</label>
        <input type="text" id="username" name="username" placeholder="Saisir le nom d’utilisateur" required>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" placeholder="Saisir le mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <p th:if="${param.error}" class="error">
        Identifiants incorrects, veuillez réessayer.
    </p>

    <p th:if="${param.logout}" class="logout">
        Vous êtes déconnecté avec succès.
    </p>
</div>

</body>
</html>
